[package]
name = "sol-drivechain-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_drivechain_bridge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4.3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-sha256-hasher = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"

[lints.rust]
# Anchor and the Solana entrypoint set these, and the host build does not know them.
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "solana"))',
] }
