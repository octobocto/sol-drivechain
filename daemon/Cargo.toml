[workspace]
members = ["."]
resolver = "2"

[package]
name = "sol-drivechain-daemon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sol_drivechain_daemon"
path = "src/lib.rs"

[[bin]]
name = "sol-drivechain-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bip39 = "3.0.0"
bitcoin = "0.32"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek-bip32 = "0.3.0"
futures = "0.3.34"
prost = "0.14.4"
prost-types = "0.14.4"
serde_json = "1.0.151"
solana-commitment-config = "3"
solana-rpc-client = "4.3.0"
solana-rpc-client-api = "4.3"
solana-sdk = "4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
tonic-prost-build = "0.14.6"

